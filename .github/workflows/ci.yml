name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  contract:
    name: Contract (${{ matrix.os }}, Node ${{ matrix.node }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, node: '22', python: '3.12' }
          - { os: ubuntu-24.04, node: '24', python: '3.14' }
          - { os: macos-latest, node: '24', python: '3.12' }
          - { os: windows-latest, node: '24', python: '3.12' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.1'
      - run: npm ci --prefix packages/node --ignore-scripts
      - run: uv sync --project packages/python --locked --python ${{ matrix.python }}
      - run: npm run check
      - run: uv run --project packages/python ruff check packages/python/src tests scripts
      - run: uv run --project packages/python ruff format --check packages/python/src tests scripts
      - run: uv run --project packages/python python scripts/check_versions.py
      - run: npm test

  distributions:
    name: Verify built distributions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.1'
      - run: uv sync --project packages/python --locked --python 3.12
      - run: uv run --project packages/python python scripts/check_versions.py
      - run: mkdir -p dist
      - run: npm pack ./packages/node --pack-destination dist
      - run: uv build packages/python --out-dir dist
      - run: uv run --project packages/python python scripts/check_artifacts.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

